[project]
name = "flyconn"
version = "0.0.1"
description = "Research-grade toolkit over public Drosophila connectomes: harmonized data, signed graphs, uncertainty, validated LIF simulation, declarative experiments."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "flyconn contributors" }]
keywords = ["connectome", "drosophila", "neuroscience", "flywire", "malecns"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "pyyaml>=6",
  "typer>=0.12",
  "requests>=2.31",
  "rich>=13",
]

[project.optional-dependencies]
interpret = [
  "torch>=2.2",
  "connectome-interpreter @ git+https://github.com/YijieYin/connectome_interpreter.git@d212f86ef32318657dc27fa65e7e8ff604bffac9",
]
sim = ["torch>=2.2"]
neuprint = ["neuprint-python>=0.6"]
cave = ["caveclient>=8"]
morph = ["navis>=1.10", "flybrains>=0.6"]

[project.scripts]
flyconn = "flyconn.cli.main:app"

[project.urls]
Documentation = "https://github.com/flyconn/flyconn"
Repository = "https://github.com/flyconn/flyconn"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-benchmark>=4",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]
brian = ["brian2>=2.10; python_version >= '3.12'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["flyconn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "RUF", "NPY", "PD"]
ignore = ["PD002", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "PD"]

[tool.pyright]
include = ["flyconn"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "golden: uses cached real data and published golden results (slow; not run in default CI)",
  "network: touches the network (never in unit CI)",
  "benchmark: throughput benchmarks",
  "brian: needs brian2 (Python >= 3.12); validation oracle tests",
]
