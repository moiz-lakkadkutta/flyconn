# M13 robustness-audited pathway screen (MaleCNS v1.0; w_syn calibrated by protocol, not
# validated; ADR-0009, ADR-0011). Same screen as w2_sweep_pathway_mn9.yaml (GOLDEN_RESULTS
# 6h) plus a robustness block. Negative control: LC4 has no LB3 -> MN9 route within 3 hops
# at min_weight 1 (checked with find_paths on 2026-10-10; see GOLDEN_RESULTS 6j).
# Check: find_paths(LB3* -> MN9, max_hops=3, min_weight=1) on malecns@1.0 gave 204286 paths
# through 906 neurons (78 sources, 2 targets); output per type:
#   LC4 126 no LB3->MN9 route at min_weight 1, <=3 hops
#   T4a 1684 no LB3->MN9 route at min_weight 1, <=3 hops
#   Mi1 1773 no LB3->MN9 route at min_weight 1, <=3 hops
#   LPLC2 185 no LB3->MN9 route at min_weight 1, <=3 hops
name: w2_robust_pathway_mn9
dataset: malecns@1.0
network: {min_weight: 1, sign_policy: argmax}
stimulate:
  - select: {cell_type: "LB3*"}
    rate_hz: 100
sweep:
  silence_each:
    rank_by: pathway
    pathway: {readout: MN9, max_hops: 3, min_weight: 5, min_edge_fraction: 0.01}
    group_by: cell_type
    max_items: 10
readouts:
  - name: MN9
    select: {cell_type: "MN9"}
  - name: descending
    select: {super_class: descending}
duration_ms: 300
trials: 10
seed: 0
device: cpu
dtype: float32
controls: {degree_preserving_rewire: 1, sign_shuffle: 1, unstimulated_baseline: true}
robustness:
  primary_readout: MN9
  readout_proxy: "MN9 motor neurons drive proboscis extension (Shiu et al. 2024, Nature 634:210)"
  w_syn: auto
  nt_samples: 8
  min_weights: [3, 5]
  replicate: flywire@783
  random_null: {n_sets: 40}
  extra_candidates:
    - {cell_type: "LC4"}
