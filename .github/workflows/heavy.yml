name: heavy-validation
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache/data
          key: flyconn-data-${{ hashFiles('flyconn/data/registry/*.yaml') }}
      - run: uv sync --group dev --group brian --extra sim --extra interpret --extra access
      - run: uv run pytest -m "golden or benchmark or brian" --benchmark-json=benchmarks/latest.json
